<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Dossier Médical — CareTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d8abc;
            --primary-dark: #0a6f96;
            --primary-light: #e0f4fc;
            --bg: #f0f5fa;
            --surface: #ffffff;
            --text: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e9f0;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 8px 32px rgba(13, 138, 188, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            font-size: 14px;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 0.55rem 1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #c5e9f7;
            transform: translateX(-2px);
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
            animation: fadeUp 0.35s ease;
            overflow-x: hidden;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            letter-spacing: -0.02em;
        }

        .page-header h1 .icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .page-header p {
            color: var(--muted);
            margin-top: 0.3rem;
            margin-left: 54px;
            font-size: 0.85rem;
        }

        /* ===== PATIENT SELECTOR ===== */
        .patient-selector {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .patient-selector label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        .patient-chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: #fafbff;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            border-color: #b0d4ec;
            background: #f0f7fb;
        }

        .chip.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .chip-avatar {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            flex-shrink: 0;
        }

        .chip-avatar.boy {
            background: linear-gradient(135deg, #4D96FF, #6BCB77);
        }

        .chip-avatar.girl {
            background: linear-gradient(135deg, #FF6B9D, #ffa8c5);
        }

        /* ===== PATIENT BANNER ===== */
        .patient-banner {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            border-radius: var(--radius-lg);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            box-shadow: var(--shadow-lg);
            flex-wrap: wrap;
        }

        .banner-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            flex-shrink: 0;
            letter-spacing: -0.05em;
        }

        .banner-info {
            flex: 1;
            min-width: 0;
        }

        .banner-info h2 {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .banner-info p {
            font-size: 0.8rem;
            opacity: 0.82;
            margin-top: 0.15rem;
        }

        .banner-stats {
            display: flex;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .banner-stat {
            text-align: center;
        }

        .banner-stat .num {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1;
        }

        .banner-stat .lbl {
            font-size: 0.68rem;
            opacity: 0.72;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* ===== TIMELINE ===== */
        .timeline {
            position: relative;
            width: 100%;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--primary-light), transparent);
        }

        .timeline-entry {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            margin-bottom: 1.2rem;
            position: relative;
            width: 100%;
            min-width: 0;
        }

        .timeline-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: white;
            position: relative;
            z-index: 1;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .timeline-dot.diagnostic {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .timeline-dot.consultation {
            background: linear-gradient(135deg, #4D96FF, #45a049);
        }

        /* ===== DOSSIER CARD ===== */
        .timeline-card {
            flex: 1 1 0;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
            word-break: break-word;
        }

        .timeline-card:hover {
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
        }

        /* Card top gradient strip */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem 1.2rem 0.8rem;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .card-header-left h3 {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .card-header-left h3 i {
            color: var(--primary);
        }

        .card-header-left .doctor {
            font-size: 0.78rem;
            color: var(--primary);
            font-weight: 600;
            margin-top: 0.1rem;
        }

        .card-header-right {
            text-align: right;
            flex-shrink: 0;
        }

        .card-date {
            font-size: 0.78rem;
            color: var(--muted);
            background: var(--bg);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            display: inline-block;
        }

        /* Sections inside card */
        .card-body {
            padding: 0.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .entry-row {
            padding: 0.65rem 0;
            border-bottom: 1px solid #f0f3f8;
        }

        .entry-row:last-child {
            border-bottom: none;
        }

        .entry-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #9ca3af;
            margin-bottom: 0.3rem;
        }

        .entry-value {
            font-size: 0.86rem;
            color: #374151;
            line-height: 1.55;
        }

        /* Constantes pills */
        .constantes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.1rem;
        }

        .constante-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 20px;
            padding: 0.25rem 0.65rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: #0369a1;
        }

        /* Ordonnances list */
        .ordonnances-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }

        .ordonnance-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem;
            flex-wrap: wrap;
        }

        .ordonnance-info {
            flex: 1;
            min-width: 0;
        }

        .ordonnance-name {
            font-weight: 700;
            color: #0c4a6e;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ordonnance-date {
            font-size: 0.73rem;
            color: var(--muted);
            margin-top: 0.1rem;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 138, 188, 0.3);
        }

        .download-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .download-btn.loading {
            opacity: 0.7;
        }

        /* Examens */
        .examens-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 0.1rem;
        }

        .examen-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.83rem;
            color: #374151;
        }

        .examen-badge {
            padding: 0.15rem 0.55rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .examen-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .examen-badge.done {
            background: #d1fae5;
            color: #065f46;
        }

        /* Timestamps bar */
        .card-timestamps {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            padding: 0.55rem 1.2rem;
            background: #fafbff;
            border-top: 1px solid var(--border);
            font-size: 0.73rem;
            color: #9ca3af;
        }

        .card-timestamps span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* Toggle btn */
        .toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.55rem 1.2rem;
            width: 100%;
            justify-content: center;
            border-top: 1px solid var(--border);
            transition: background 0.15s;
        }

        .toggle-btn:hover {
            background: var(--primary-light);
        }

        /* Collapsed state */
        .entry-row.collapsible {
            transition: all 0.25s ease;
        }

        .entry-collapsed .entry-row.collapsible {
            display: none;
        }

        .entry-collapsed .card-timestamps {
            display: none;
        }

        /* Paiement badge */
        .paiement-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 20px;
            padding: 0.3rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: #065f46;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            color: var(--muted);
        }

        .empty-state .empty-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--bg);
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #d1d5db;
        }

        .empty-state h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 0.3rem;
        }

        .empty-state p {
            font-size: 0.83rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .main {
                padding: 1rem 0.75rem 2.5rem;
            }

            .page-header h1 {
                font-size: 1.3rem;
            }

            .page-header p {
                margin-left: 0;
                margin-top: 0.5rem;
            }

            .navbar {
                padding: 0.75rem 1rem;
            }

            .navbar-brand {
                font-size: 1.1rem;
            }

            .patient-banner {
                padding: 1rem;
                gap: 0.8rem;
            }

            .banner-stats {
                width: 100%;
                justify-content: space-around;
                padding-top: 0.5rem;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
            }

            .timeline::before {
                left: 15px;
            }

            .timeline-dot {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }

            .timeline-entry {
                gap: 0.7rem;
            }

            .card-header {
                flex-direction: column;
            }

            .card-header-right {
                text-align: left;
            }

            .constante-pill {
                font-size: 0.72rem;
                padding: 0.2rem 0.5rem;
            }

            .card-timestamps {
                gap: 0.8rem;
                font-size: 0.7rem;
            }

            .ordonnance-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .download-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html"><i class="fas fa-hospital-user"></i> CareTrack</a>
        <a class="back-btn" href="dashboard.html"><i class="fas fa-arrow-left"></i> Retour</a>
    </nav>

    <div class="main">
        <div class="page-header">
            <h1>
                <span class="icon-wrap"><i class="fas fa-notes-medical"></i></span>
                Dossier Médical
            </h1>
            <p>Historique médical complet — consultations, diagnostics et ordonnances</p>
        </div>

        <!-- Patient selector -->
        <div class="patient-selector">
            <label><i class="fas fa-users" style="margin-right:0.3rem"></i> Dossier de :</label>
            <div class="patient-chips" id="patientChips">
                <div style="color:#aaa;font-size:0.85rem"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
            </div>
        </div>

        <!-- Patient Banner -->
        <div class="patient-banner" id="patientBanner" style="display:none">
            <div class="banner-avatar" id="bannerAvatar">—</div>
            <div class="banner-info">
                <h2 id="bannerName">—</h2>
                <p id="bannerSub">—</p>
            </div>
            <div class="banner-stats">
                <div class="banner-stat">
                    <div class="num" id="statNbDossiers">—</div>
                    <div class="lbl">Dossiers</div>
                </div>
                <div class="banner-stat">
                    <div class="num" id="statNbOrdonnances">—</div>
                    <div class="lbl">Ordonnances</div>
                </div>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline" id="timeline">
            <div class="empty-state">
                <div class="empty-icon"><i class="fas fa-user-md"></i></div>
                <h3>Sélectionnez un patient</h3>
                <p>Le dossier médical s'affichera ici.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://172.16.84.81:5000' + '/api';
        let selfUser = null;
        let familyMembers = [];

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return null; }
            return token;
        }

        async function init() {
            const token = checkAuth();
            if (!token) return;
            try {
                const [profileRes, familyRes] = await Promise.all([
                    fetch(`${API_URL}/auth/profile`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(`${API_URL}/family`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                const profileData = await profileRes.json();
                const familyData = await familyRes.json();
                if (profileData.success) selfUser = profileData.data;
                familyMembers = familyData.success ? familyData.members : [];
                buildChips();
                selectPatient('self', selfUser);
            } catch (e) {
                console.error('Init error:', e);
            }
        }

        function buildChips() {
            const chips = document.getElementById('patientChips');
            const initials = selfUser ? `${selfUser.prenom[0]}${selfUser.nom[0]}`.toUpperCase() : 'Moi';
            let html = `<div class="chip active" id="chip-self" onclick="selectPatient('self', selfUser)">
                <div class="chip-avatar">${initials}</div>
                ${selfUser ? selfUser.prenom + ' ' + selfUser.nom : 'Moi'}
            </div>`;
            familyMembers.forEach(m => {
                const mi = `${m.prenom[0]}${m.nom[0]}`.toUpperCase();
                const cls = m.sexe === 'homme' ? 'boy' : m.sexe === 'femme' ? 'girl' : '';
                html += `<div class="chip" id="chip-${m.id_member}" onclick="selectPatient('member', ${JSON.stringify(m).replace(/"/g, '&quot;')})">
                    <div class="chip-avatar ${cls}">${mi}</div>
                    ${m.prenom} ${m.nom}
                </div>`;
            });
            chips.innerHTML = html;
        }

        async function selectPatient(type, patient) {
            if (!patient) return;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const chipId = type === 'self' ? 'chip-self' : `chip-${patient.id_member}`;
            document.getElementById(chipId)?.classList.add('active');

            const banner = document.getElementById('patientBanner');
            banner.style.display = 'flex';
            const initials = `${patient.prenom[0]}${patient.nom[0]}`.toUpperCase();
            document.getElementById('bannerAvatar').textContent = initials;
            document.getElementById('bannerName').textContent = `${patient.prenom} ${patient.nom}`;
            const dob = patient.date_naissance ? new Date(patient.date_naissance).toLocaleDateString('fr-FR') : '—';
            document.getElementById('bannerSub').textContent = type === 'self'
                ? `Email : ${patient.email}`
                : `${patient.lien || 'Membre de la famille'} · Né(e) le ${dob}`;

            await loadDossier(type, patient);
        }

        async function loadDossier(type, patient) {
            const token = checkAuth();
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = `<div class="empty-state">
                <div class="empty-icon"><i class="fas fa-spinner fa-spin" style="font-size:1.5rem;color:#0d8abc"></i></div>
                <h3>Chargement du dossier…</h3>
            </div>`;

            try {
                const baseParams = type === 'member' ? `?id_member=${patient.id_member}` : '';
                const dossierUrl = type === 'self'
                    ? `${API_URL}/dossiers/patient/${selfUser.id_patient}`
                    : `${API_URL}/dossiers/patient/${patient.id_member}?type=member`;

                const dr = await fetch(dossierUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                const dd = await dr.json();
                const dossiers = dd.success ? dd.data : [];

                const totalOrdonnances = dossiers.reduce((sum, d) => sum + (d.ordonnances?.length || 0), 0);
                document.getElementById('statNbDossiers').textContent = dossiers.length;
                document.getElementById('statNbOrdonnances').textContent = totalOrdonnances;

                renderTimeline(dossiers);
            } catch (e) {
                timeline.innerHTML = `<div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-exclamation-triangle" style="color:#ef4444"></i></div>
                    <h3>Erreur de chargement</h3>
                    <p>Impossible de récupérer le dossier médical.</p>
                </div>`;
            }
        }

        function fmtDate(d) {
            if (!d) return '—';
            try {
                const dt = new Date(d);
                if (isNaN(dt.getTime())) return '—';
                return dt.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
            } catch (e) { return '—'; }
        }
        function fmtTime(d) {
            if (!d) return '--:--';
            try {
                const dt = new Date(d);
                if (isNaN(dt.getTime())) return '--:--';
                return dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            } catch (e) { return '--:--'; }
        }

        /* Échappe les caractères HTML pour éviter de casser le DOM */
        function esc(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderTimeline(dossiers) {
            const timeline = document.getElementById('timeline');
            if (!dossiers.length) {
                timeline.innerHTML = `<div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-folder-open"></i></div>
                    <h3>Aucun dossier médical</h3>
                    <p>Ce patient n'a pas encore eu de consultation enregistrée.</p>
                </div>`;
                return;
            }

            const sorted = [...dossiers].sort((a, b) => {
                const da = new Date(a.heure_fin || a.heure_arrivee || a.date_consultation || 0);
                const db = new Date(b.heure_fin || b.heure_arrivee || b.date_consultation || 0);
                return db - da;
            });

            const cards = [];
            sorted.forEach((d, i) => {
                try {
                    cards.push(renderCard(d, i));
                } catch (err) {
                    console.error('Erreur rendu dossier', i, err, d);
                }
            });
            timeline.innerHTML = cards.join('');
        }

        function renderCard(d, i) {
            const dateRef = d.heure_fin || d.heure_arrivee || d.date_consultation;
            const dateStr = fmtDate(dateRef);

            /* --- CONSTANTES --- */
            const constantesHtml = d.constantes && d.constantes.length > 0
                ? `<div class="entry-row collapsible">
                        <div class="entry-label">Constantes vitales</div>
                        <div class="constantes-grid">
                            ${d.constantes.map(c => `
                                ${c.temperature ? `<span class="constante-pill">🌡️ ${esc(c.temperature)}°C</span>` : ''}
                                ${c.frequence_cardiaque ? `<span class="constante-pill">❤️ ${esc(c.frequence_cardiaque)} bpm</span>` : ''}
                                ${c.spo2 ? `<span class="constante-pill">💨 ${esc(c.spo2)}% SpO2</span>` : ''}
                                ${c.tension_systolique ? `<span class="constante-pill">💉 ${esc(c.tension_systolique)}/${esc(c.tension_diastolique)} mmHg</span>` : ''}
                            `).join('')}
                        </div>
                    </div>` : '';

            /* --- ORDONNANCES --- */
            const ordonnancesHtml = d.ordonnances && d.ordonnances.length > 0
                ? `<div class="entry-row">
                        <div class="entry-label"><i class="fas fa-prescription" style="margin-right:0.3rem"></i>Ordonnances (${d.ordonnances.length})</div>
                        <div class="ordonnances-list">
                            ${d.ordonnances.map(o => {
                    const datePrescrit = o.date_prescription ? (() => { try { const dt = new Date(o.date_prescription); return isNaN(dt.getTime()) ? '—' : dt.toLocaleDateString('fr-FR'); } catch (e) { return '—'; } })() : '—';
                    return `
                                <div class="ordonnance-item">
                                    <div class="ordonnance-info">
                                        <div class="ordonnance-name"><i class="fas fa-pills" style="margin-right:0.35rem;opacity:0.7"></i>${esc(o.posologie || o.medicament || 'Ordonnance')}</div>
                                        <div class="ordonnance-date">Prescrit le ${datePrescrit}</div>
                                    </div>
                                    <button class="download-btn" id="dl-btn-${o.id_ordonnance}" onclick="downloadOrdonnance(${o.id_ordonnance})">
                                        <i class="fas fa-download"></i> PDF
                                    </button>
                                </div>`;
                }).join('')}
                        </div>
                    </div>` : '';

            /* --- EXAMENS --- */
            const examensHtml = d.examens && d.examens.length > 0
                ? `<div class="entry-row collapsible">
                        <div class="entry-label">Examens demandés</div>
                        <div class="examens-list">
                            ${d.examens.map(ex => `
                                <div class="examen-item">
                                    <i class="fas fa-flask" style="color:#6366f1;font-size:0.8rem"></i>
                                    <span>${esc(ex.type_examen)}</span>
                                    ${ex.conclusion
                        ? `<span class="examen-badge done"><i class="fas fa-check"></i> ${esc(ex.conclusion)}</span>`
                        : `<span class="examen-badge pending">En attente</span>`}
                                </div>
                            `).join('')}
                        </div>
                    </div>` : '';

            /* --- PAIEMENT --- */
            const paiementHtml = d.montant_paye
                ? `<div class="entry-row collapsible">
                        <div class="entry-label">Paiement</div>
                        <span class="paiement-badge"><i class="fas fa-check-circle"></i> ${esc(d.montant_paye)} MAD · ${esc(d.mode_paiement || 'N/A')}</span>
                    </div>` : '';

            /* --- TIMESTAMPS --- */
            const timestampsHtml = `<div class="card-timestamps">
                    <span><i class="far fa-clock"></i> Arrivée : ${fmtTime(d.heure_arrivee)}</span>
                    ${d.heure_debut ? `<span><i class="fas fa-play-circle"></i> Début : ${fmtTime(d.heure_debut)}</span>` : ''}
                    <span><i class="fas fa-flag-checkered"></i> Fin : ${fmtTime(d.heure_fin)}</span>
                </div>`;

            return `
                <div class="timeline-entry">
                    <div class="timeline-dot diagnostic"><i class="fas fa-notes-medical"></i></div>
                    <div class="timeline-card">
                        <div class="card-header">
                            <div class="card-header-left">
                                <h3><i class="fas fa-file-medical"></i> Dossier médical</h3>
                                <div class="doctor">Dr. ${esc(d.medecin_prenom)} ${esc(d.medecin_nom)}${d.specialite ? ' · ' + esc(d.specialite) : ''}</div>
                            </div>
                            <div class="card-header-right">
                                <span class="card-date"><i class="fas fa-calendar-alt" style="margin-right:0.3rem;opacity:0.6"></i>${dateStr}</span>
                            </div>
                        </div>

                        <div class="card-body" id="card-body-${i}">
                            ${d.motif ? `<div class="entry-row">
                                <div class="entry-label">Motif de consultation</div>
                                <div class="entry-value">${esc(d.motif)}</div>
                            </div>` : ''}

                            ${ordonnancesHtml}

                            ${d.observations ? `<div class="entry-row collapsible">
                                <div class="entry-label">Observations</div>
                                <div class="entry-value">${esc(d.observations)}</div>
                            </div>` : ''}

                            ${d.diagnostic ? `<div class="entry-row collapsible">
                                <div class="entry-label">Diagnostic</div>
                                <div class="entry-value">${esc(d.diagnostic)}</div>
                            </div>` : ''}

                            ${constantesHtml}
                            ${examensHtml}
                            ${paiementHtml}

                            ${d.notes ? `<div class="entry-row collapsible">
                                <div class="entry-label">Notes complémentaires</div>
                                <div class="entry-value">${esc(d.notes)}</div>
                            </div>` : ''}
                        </div>

                        ${timestampsHtml}

                        <button class="toggle-btn" id="toggle-${i}" onclick="toggleEntry(${i})">
                            <i class="fas fa-chevron-down"></i> Voir les détails complets
                        </button>
                    </div>
                </div>`;
        }

        function toggleEntry(i) {
            const body = document.getElementById(`card-body-${i}`);
            const btn = document.getElementById(`toggle-${i}`);
            const timestamps = body.nextElementSibling;
            const isCollapsed = body.classList.toggle('entry-collapsed');

            if (isCollapsed) {
                btn.innerHTML = '<i class="fas fa-chevron-down"></i> Voir les détails complets';
                timestamps.style.display = 'none';
            } else {
                btn.innerHTML = '<i class="fas fa-chevron-up"></i> Réduire';
                timestamps.style.display = 'flex';
            }
        }

        async function downloadOrdonnance(ordonnanceId) {
            const token = localStorage.getItem('token');
            if (!token) { alert('Vous devez être connecté.'); return; }
            const btn = document.getElementById(`dl-btn-${ordonnanceId}`);
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> En cours…'; }

            try {
                const response = await fetch(`${API_URL}/ordonnances/${ordonnanceId}/download`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    const err = await response.json();
                    alert(`Erreur : ${err.message || 'Impossible de télécharger l\'ordonnance'}`);
                    return;
                }
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ordonnance_${ordonnanceId}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (e) {
                console.error(e);
                alert('Erreur lors du téléchargement.');
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> PDF'; }
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
