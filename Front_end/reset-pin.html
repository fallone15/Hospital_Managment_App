<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Réinitialiser PIN – CareTrack</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0EA5E9",
                        "background-light": "#F8FAFC",
                        "background-dark": "#0F172A",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .medical-gradient {
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.08), transparent 40%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.08), transparent 40%);
        }
    </style>
</head>

<body
    class="font-display bg-background-light dark:bg-background-dark min-h-screen selection:bg-primary/30 text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <div class="relative min-h-screen w-full flex flex-col overflow-hidden medical-gradient">

        <!-- NAVIGATION -->
        <nav class="fixed top-0 w-full z-50 px-6 py-4">
            <div class="max-w-7xl mx-auto flex items-center justify-between glass px-6 py-3 rounded-full shadow-lg">
                <div class="flex items-center gap-2">
                    <span class="material-icons-round text-primary text-3xl">health_and_safety</span>
                    <span
                        class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-blue-600">CareTrack</span>
                </div>
            </div>
        </nav>

        <main class="flex-1 flex items-center justify-center p-6 pt-24 relative z-10">
            <div class="w-full max-w-[440px]">
                <div
                    class="glass dark:bg-slate-900/40 p-8 md:p-10 rounded-3xl shadow-2xl shadow-primary/10 transition-all duration-300">
                    <div class="text-center mb-10">
                        <div
                            class="inline-flex items-center justify-center w-20 h-20 bg-primary/10 rounded-2xl mb-6 transform rotate-6">
                            <span class="material-icons-round text-primary text-5xl">vpn_key</span>
                        </div>
                        <h1 class="text-slate-900 dark:text-slate-100 text-3xl font-extrabold tracking-tight mb-2">
                            Nouveau PIN</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Définissez votre nouveau code
                            PIN de sécurité à 4 chiffres.</p>
                    </div>

                    <form id="resetForm" class="space-y-6">
                        <div class="space-y-2">
                            <label
                                class="text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider ml-1">Nouveau
                                Code PIN</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                                    <span class="material-icons-round text-xl">lock</span>
                                </div>
                                <input id="pin" name="pin"
                                    class="w-full pl-11 pr-4 py-4 bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base tracking-[0.5em]"
                                    placeholder="••••" type="password" maxlength="4" pattern="[0-9]{4}" required />
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label
                                class="text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider ml-1">Confirmer
                                le PIN</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                                    <span class="material-icons-round text-xl">lock_outline</span>
                                </div>
                                <input id="confirmPin" name="confirmPin"
                                    class="w-full pl-11 pr-4 py-4 bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base tracking-[0.5em]"
                                    placeholder="••••" type="password" maxlength="4" pattern="[0-9]{4}" required />
                            </div>
                        </div>

                        <button type="submit"
                            class="w-full py-4 bg-primary text-white rounded-xl font-bold text-base shadow-lg shadow-primary/25 hover:shadow-primary/40 hover:scale-[1.02] transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
                            <span>Changer le PIN</span>
                            <span class="material-icons-round text-xl">check_circle</span>
                        </button>
                    </form>

                    <div id="messageBox" class="hidden mt-6 p-4 rounded-xl text-sm font-medium text-center"></div>

                    <div id="backToLogin" class="hidden mt-6 text-center">
                        <a class="text-primary font-bold hover:underline" href="login.html">Retour à la connexion</a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="w-full px-12 py-6 flex justify-between items-center text-xs text-slate-400 z-10">
            <p>© 2026 CareTrack Systems. Tous droits réservés.</p>
        </footer>

        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-400/5 rounded-full blur-[120px]"></div>
    </div>
    <script src="reset-pin.js"></script>
</body>

</html>
